<!DOCTYPE html>
<html lang="en" dir="ltr">
	<head>
		<title>@aegisjsproject/atlas</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="A client-side router library using `Navigation` & `URLPattern`" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
		<script type="importmap" integrity="{{ INTEGRITY }}">{{ IMPORTMAP }}</script>
		<script src="{{ POLYFILLS }}" referrerpolicy="no-referrer" crossorigin="anonymous" defer=""></script>
		<script type="application/json" name="routes">{
			"/posts/:year(\\d{4})/:month(\\d{2})/:day(\\d{2})/:slug": "/routes/blog.js",
			"/search": "@aegisjsproject/atlas/routes/form.js"
		}</script>
		<script type="module" src="/index.js" referrerpolicy="no-referrer"></script>
	</head>
	<body>
		<header id="header">
			<h1>Hello, World!</h1>
		</header>
		<nav id="nav">
			<a href="/">Home</a>
			<a href="/posts/2026/04/29/test-post">Test Post</a>
		</nav>
		<main id="main">
			<search>
				<form action="/search">
					<label for="search">Search</label>
					<input type="search" id="search" name="q" placeholder="query" required="" />
					<button type="submit">Submit</button>
					<button type="submit" formmethod="get">GET</button>
					<button type="submit" formmethod="post">POST</button>
				</form>
			</search>
			<details>
				<summary>Request</summary>
				<pre>
					<code>{{ REQUEST }}</code>
				</pre>
			</details>
			<details>
				<summary>Context</summary>
				<pre>
					<code>{{ CONTEXT }}</code>
				</pre>
			</details>
		</main>
		<aside id="sidebar"></aside>
		<footer id="footer"></footer>
	</body>
</html>
